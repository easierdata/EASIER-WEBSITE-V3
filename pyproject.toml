[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easier-website"
version = "1.0.0"
description = "EASIER Data Initiative Website - Sphinx-based documentation and blog"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "The EASIER Data Initiative"}
]
maintainers = [
    {name = "The EASIER Data Initiative"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Scientific/Engineering"
]
requires-python = ">=3.8"

# Core dependencies for the website
dependencies = [
    # Sphinx core and extensions
    "Sphinx>=7.4.7",
    "ablog>=0.11.2",
    "myst-parser>=4.0.1",
    "sphinx-new-tab-link>=0.8.0",
    "sphinx-panels>=0.4.1",
    "sphinx_subfigure>=0.2.4",
    "pydata-sphinx-theme>=0.16.1",
    
    # Notebook support
    "nbsphinx>=0.9.7",
    "nbconvert>=7.16.6",
    "nbformat>=5.10.4",
    "nbclient>=0.10.2",
    "jupyterlab_pygments>=0.3.0",
    "ipython>=9.5.0",
    "ipython_pygments_lexers>=1.1.1",
    
    # Sphinx contrib extensions
    "sphinxcontrib-applehelp>=2.0.0",
    "sphinxcontrib-devhelp>=2.0.0",
    "sphinxcontrib-htmlhelp>=2.1.0",
    "sphinxcontrib-jsmath>=1.0.1",
    "sphinxcontrib-qthelp>=2.0.0",
    "sphinxcontrib-serializinghtml>=2.0.0",
    "sphinxcontrib-images>=1.0.1",
    "sphinxcontrib-extdevhelper-kasane>=0.2.0",
    "sphinxcontrib-mermaid>=1.0.0",
    
    # Content processing and markup
    "docutils>=0.21.2",
    "Jinja2>=3.1.6",
    "MarkupSafe>=3.0.2",
    "Pygments>=2.19.2",
    "accessible-pygments>=0.0.5",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.5.0",
    "mdurl>=0.1.2",
    
    # Feed generation and blog functionality
    "feedgen>=1.0.0",
    "babel>=2.17.0",
    "python-dateutil>=2.9.0.post0",
    
    # HTML processing and parsing
    "beautifulsoup4>=4.13.5",
    "bleach>=6.2.0",
    "lxml>=6.0.1",
    "soupsieve>=2.8",
    "tinycss2>=1.4.0",
    "webencodings>=0.5.1",
    
    # Utility libraries
    "attrs>=25.3.0",
    "packaging>=25.0",
    "six>=1.17.0",
    "setuptools>=80.9.0",
    "imagesize>=1.4.1",
    "snowballstemmer>=3.0.1",
    
    # Network and serialization
    "requests>=2.32.5",
    "urllib3>=2.5.0",
    "certifi>=2025.8.3",
    "charset-normalizer>=3.4.3",
    "idna>=3.10",
    
    # Data validation and schema
    "jsonschema>=4.25.1",
    "jsonschema-specifications>=2025.9.1",
    "referencing>=0.36.2",
    "rpds-py>=0.27.1",
    
    # YAML processing
    "PyYAML>=6.0.2",
    
    # Notebook processing
    "mistune>=3.1.4",
    "pandocfilters>=1.5.1",
    "defusedxml>=0.7.1",
    "fastjsonschema>=2.21.2",
    
    # Jupyter core components
    "jupyter_client>=8.6.3",
    "jupyter_core>=5.8.1",
    "traitlets>=5.14.3",
    "pyzmq>=27.1.0",
    "tornado>=6.5.2",
    
    # Interactive components
    "matplotlib-inline>=0.1.7",
    "executing>=2.2.1",
    "asttokens>=3.0.0",
    "pure_eval>=0.2.3",
    "stack-data>=0.6.3",
    "decorator>=5.2.1",
    "jedi>=0.19.2",
    "parso>=0.8.5",
    "prompt_toolkit>=3.0.52",
    "wcwidth>=0.2.13",
    
    # Platform utilities
    "platformdirs>=4.4.0",
    "watchdog>=6.0.0",
    "colorama>=0.4.6",
    "typing_extensions>=4.15.0"
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "invoke>=2.2.0",
    "pypandoc>=1.15"
]

# Documentation building (for CI/CD)
docs = [
    "alabaster>=0.7.16"
]

[project.urls]
"Homepage" = "https://easierdata.org"
"Repository" = "https://github.com/easierdata/EASIER-WEBSITE-V3"
"Bug Tracker" = "https://github.com/easierdata/EASIER-WEBSITE-V3/issues"

[tool.setuptools]
packages = []

[tool.setuptools.package-data]
"*" = ["*.rst", "*.md", "*.html", "*.js", "*.css", "*.png", "*.jpg", "*.jpeg", "*.gif", "*.svg"]